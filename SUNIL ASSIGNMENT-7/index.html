        }

        .box {
            height: 100vh;
            display: flex;

            width: 30%;

            background-color: #1e1b4b;

            width: 70%;

        }

        .button {
            height: 8%;
            background-color: #6366f1;
            border: 2px solid #a5b4fc;
            border: none;
            border-radius: 30px;
            transition: 0.3s;
        }

        .button:hover {
            background-color: #d6ae4b;
            transform: scale(1.05);
        }

        a {
            color: white;
            font-size: 22px;
            text-decoration: none;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button:hover a {
            color: #1e1b4b;
        }
    </style>
